<!DOCTYPE html>
<html>
<head>
<title>Ultimate WebOS Final</title>

<style>
body { margin:0; font-family:Arial; }

/* SCREENS */
.screen {
 position:fixed;
 width:100%;
 height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 flex-direction:column;
}

/* BOOT */
#boot { background:black; color:lime; }

/* LOGIN */
#login {
 display:none;
 background:linear-gradient(#141e30,#243b55);
 color:white;
}

/* LOCK */
#lock {
 display:none;
 background:black;
 color:white;
 font-size:40px;
 cursor:pointer;
}

/* DESKTOP */
#desktop {
 display:none;
 height:100vh;
 padding:20px;
 color:white;
 background:linear-gradient(#141e30,#243b55);
}

/* SIDEBAR */
.sidebar {
 position:absolute;
 left:10px;
 top:80px;
 display:flex;
 flex-direction:column;
}

/* ICON */
.icon {
 position: relative;
 background:rgba(255,255,255,0.2);
 padding:12px;
 margin:8px;
 border-radius:12px;
 cursor:pointer;
 text-align:center;
 width:60px;
 font-size:22px;
}

/* TOOLTIP */
.icon::after {
 content: attr(data-name);
 position:absolute;
 left:110%;
 top:50%;
 transform:translateY(-50%);
 background:black;
 color:white;
 padding:5px 10px;
 border-radius:5px;
 font-size:12px;
 opacity:0;
 transition:0.2s;
}

.icon:hover::after { opacity:1; }

/* WINDOW */
.window {
 position:absolute;
 width:350px;
 height:300px;
 background:white;
 display:none;
 border-radius:10px;
 box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* TITLE */
.titlebar {
 background:#333;
 color:white;
 padding:5px;
 cursor:move;
 display:flex;
 justify-content:space-between;
}

/* TASKBAR */
.taskbar {
 position:fixed;
 bottom:0;
 width:100%;
 background:black;
 padding:8px;
 display:flex;
 justify-content:space-between;
 color:white;
}

/* SEARCH */
.search { padding:5px; }

/* RIGHT CLICK MENU */
#menu {
 position:absolute;
 background:white;
 display:none;
 border-radius:5px;
 box-shadow:0 0 10px black;
}

#menu div {
 padding:10px;
 cursor:pointer;
}

#menu div:hover { background:#ddd; }

</style>
</head>

<body>

<!-- BOOT -->
<div id="boot" class="screen">
<h2>⚡ Booting WebOS...</h2>
</div>

<!-- LOGIN -->
<div id="login" class="screen">
<h2>Login</h2>
<input id="user" placeholder="Name"><br>
<input type="password" id="pass" placeholder="Password"><br>
<button onclick="login()">Enter</button>
<p id="msg"></p>
</div>

<!-- LOCK -->
<div id="lock" class="screen" onclick="unlock()">
<div id="time"></div>
<p>Click to Unlock</p>
</div>

<!-- DESKTOP -->
<div id="desktop">

<h2 id="welcome"></h2>

<button onclick="lockScreen()">🔒 Lock</button>

<!-- SIDEBAR -->
<div class="sidebar">
<div class="icon" data-name="Notes" onclick="openApp('notes')">📝</div>
<div class="icon" data-name="YouTube" onclick="openApp('youtube')">📺</div>
<div class="icon" data-name="Browser" onclick="openApp('browser')">🌐</div>
<div class="icon" data-name="Music" onclick="openApp('music')">🎵</div>
<div class="icon" data-name="Routine" onclick="openApp('routine')">📅</div>
</div>

</div>

<!-- WINDOWS -->

<div id="notes" class="window" style="top:100px;left:150px;">
<div class="titlebar" onmousedown="drag(event,'notes')" onclick="focusWin(this.parentElement)">
Notes <span onclick="closeApp('notes')">❌</span>
</div>
<textarea id="noteText" style="width:100%;height:80%"></textarea>
</div>

<div id="youtube" class="window" style="top:120px;left:200px;">
<div class="titlebar" onmousedown="drag(event,'youtube')" onclick="focusWin(this.parentElement)">
YouTube <span onclick="closeApp('youtube')">❌</span>
</div>
<iframe width="100%" height="90%" src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
</div>

<div id="browser" class="window" style="top:150px;left:250px;">
<div class="titlebar" onmousedown="drag(event,'browser')" onclick="focusWin(this.parentElement)">
Browser <span onclick="closeApp('browser')">❌</span>
</div>
<input id="url" placeholder="Enter URL">
<button onclick="go()">Go</button>
<iframe id="frame" style="width:100%;height:70%"></iframe>
</div>

<div id="music" class="window" style="top:180px;left:300px;">
<div class="titlebar" onmousedown="drag(event,'music')" onclick="focusWin(this.parentElement)">
Music <span onclick="closeApp('music')">❌</span>
</div>
<audio controls style="width:100%">
<source src="song.mp3">
</audio>
</div>

<div id="routine" class="window" style="top:200px;left:350px;">
<div class="titlebar" onmousedown="drag(event,'routine')" onclick="focusWin(this.parentElement)">
Routine <span onclick="closeApp('routine')">❌</span>
</div>
<ul>
<li>5 AM - Wake + Exercise</li>
<li>9 AM - Coaching</li>
<li>12 PM - Study</li>
<li>6 PM - Workout</li>
</ul>
</div>

<!-- RIGHT CLICK MENU -->
<div id="menu">
<div onclick="theme(1)">🌌 Dark</div>
<div onclick="theme(2)">🌅 Sunset</div>
<div onclick="theme(3)">🌊 Ocean</div>
<div onclick="lockScreen()">🔒 Lock</div>
</div>

<!-- TASKBAR -->
<div class="taskbar">
<div>
<span onclick="openApp('notes')">📝</span>
<span onclick="openApp('youtube')">📺</span>
<span onclick="openApp('browser')">🌐</span>
</div>

<div>
<input id="search" class="search">
<button onclick="search()">Search</button>
</div>
</div>

<script>

/* BOOT */
setTimeout(()=>{
 document.getElementById("boot").style.display="none";
 document.getElementById("login").style.display="flex";
},1500);

let PASSWORD="12345";

/* LOGIN */
function login(){
 let u=document.getElementById("user").value;
 let p=document.getElementById("pass").value;

 if(p===PASSWORD){
  localStorage.setItem("user",u);
  document.getElementById("login").style.display="none";
  start();
 } else {
  document.getElementById("msg").innerText="Wrong password";
 }
}

/* START */
function start(){
 document.getElementById("desktop").style.display="block";
 document.getElementById("welcome").innerText="Welcome "+localStorage.getItem("user");

 document.getElementById("noteText").value=
 localStorage.getItem("notes")||"";
}

/* SAVE NOTES */
setInterval(()=>{
 let t=document.getElementById("noteText");
 if(t) localStorage.setItem("notes",t.value);
},1000);

/* LOCK SYSTEM */
function lockScreen(){
 document.getElementById("desktop").style.display="none";
 document.getElementById("lock").style.display="flex";
}

function unlock(){
 document.getElementById("lock").style.display="none";
 document.getElementById("login").style.display="flex";
}

/* TIME */
setInterval(()=>{
 let d=new Date();
 document.getElementById("time").innerText=d.toLocaleTimeString();
},1000);

/* APPS */
function openApp(id){ document.getElementById(id).style.display="block"; }
function closeApp(id){ document.getElementById(id).style.display="none"; }

/* DRAG */
function drag(e,id){
 let box=document.getElementById(id);
 let shiftX=e.clientX-box.offsetLeft;
 let shiftY=e.clientY-box.offsetTop;

 function move(x,y){
  box.style.left=x-shiftX+'px';
  box.style.top=y-shiftY+'px';
 }

 function onMove(e){ move(e.pageX,e.pageY); }

 document.addEventListener('mousemove',onMove);

 document.onmouseup=function(){
  document.removeEventListener('mousemove',onMove);
 };
}

/* FOCUS */
let z=1;
function focusWin(w){
 z++;
 w.style.zIndex=z;
}

/* THEMES */
function theme(n){
 let d=document.getElementById("desktop");
 if(n==1) d.style.background="linear-gradient(#141e30,#243b55)";
 if(n==2) d.style.background="linear-gradient(#ff7e5f,#feb47b)";
 if(n==3) d.style.background="linear-gradient(#43cea2,#185a9d)";
 document.getElementById("menu").style.display="none";
}

/* RIGHT CLICK */
document.addEventListener("contextmenu",(e)=>{
 e.preventDefault();
 let menu=document.getElementById("menu");
 menu.style.display="block";
 menu.style.left=e.pageX+"px";
 menu.style.top=e.pageY+"px";
});

/* HIDE MENU */
document.addEventListener("click",()=>{
 document.getElementById("menu").style.display="none";
});

/* SEARCH */
function search(){
 let s=document.getElementById("search").value.toLowerCase();

 if(s.includes("note")) openApp("notes");
 else if(s.includes("youtube")) openApp("youtube");
 else if(s.includes("browser")) openApp("browser");
 else if(s.includes("music")) openApp("music");
 else window.open("https://www.google.com/search?q="+s);
}

/* BROWSER */
function go(){
 let url=document.getElementById("url").value;
 document.getElementById("frame").src=url;
}

</script>

</body>
</html>
