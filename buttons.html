<STYLE>
    .subscribe-button { 
    background-color: rgb(201, 0, 0);
    color:white;
    border: none;
    height: 30px;  
    width: 105px;
    border-radius: 3px;
    cursor: pointer;
    transition: opacity 0.15s;
}
.subscribe-button:hover {
opacity: 0.9;
}
.subscribe-button:active {
opacity: 0.5;
}
</STYLE>
